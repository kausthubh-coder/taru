<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Same mark as logo.svg. The ink follows the system color scheme so it reads on light and dark tabs. -->
  <style>
    .ink { stroke: #171717; fill: #171717; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #fafafa; fill: #fafafa; } }
  </style>
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path class="ink" d="M7 18V8"/>
    <path class="ink" d="M7 13c0-4 10-2.5 10-7"/>
  </g>
  <circle class="ink" cx="7" cy="19" r="2.5" stroke="none"/>
  <circle class="ink" cx="7" cy="6" r="2.5" stroke="none"/>
  <circle cx="17" cy="5" r="2.5" fill="#2da44e"/>
</svg>
